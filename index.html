<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Homework Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Homework Manager</h1>

        <form id="homeworkForm">

            <!-- Used when editing -->
            <input
                type="hidden"
                id="editId"
            >

            <label for="title">
                Title:
            </label>

            <input
                id="title"
                type="text"
                placeholder="Homework title"
                maxlength="256"
                required
            >


            <label for="note">
                Note (optional):
            </label>

            <textarea
                id="note"
                placeholder="Write a note..."
                maxlength="1000"
            ></textarea>


            <label for="dt">
                Date:
            </label>

            <input
                type="datetime-local"
                id="dt"
                required
            >


            <div class="button-row">

                <button
                    type="submit"
                    id="submitButton"
                >
                    Post Homework
                </button>

                <button
                    type="button"
                    id="cancelButton"
                    class="secondary"
                    hidden
                >
                    Cancel
                </button>

            </div>

        </form>


        <div id="status"></div>


        <section class="homework-section">

            <div class="section-header">

                <h2>Homework List</h2>

                <button
                    type="button"
                    id="refreshButton"
                    class="refresh-button"
                >
                    Refresh
                </button>

            </div>


            <div id="homeworkList">

                <p class="empty">
                    Loading...
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
